<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<meta name="description" content="디지털 미니 수첩 — 이미지 노트를 한눈에 보고 바로 편집">
<title>미니수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<section id="home" class="screen" hidden>
  <div class="home-inner">
    <div class="home-logo"><img src="icons/icon-192.png" alt=""><div><h1>미니수첩</h1><p>후루룩 적고, 한눈에 보고, 바로 고치는 이미지 노트</p></div></div>
    <div id="home-actions" class="home-actions"></div>
  </div>
</section>

<section id="gallery" class="screen" hidden>
  <header id="g-bar" class="bar g-bar"></header>
  <div id="g-scroll" class="g-scroll">
    <div id="g-dirs" class="g-dirs"></div>
    <div id="g-grid" class="g-grid"></div>
    <div id="g-empty" class="g-empty" hidden>아직 노트가 없어요.<br>오른쪽 아래 + 버튼으로 새 노트를 만들어보세요.</div>
  </div>
  <button id="g-new" class="fab" title="새 노트" aria-label="새 노트"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="g-progress"></div>
</section>

<section id="viewer" class="screen" hidden>
  <header id="v-bar" class="bar v-bar"></header>
  <div id="v-stage" class="v-stage"></div>
</section>

<section id="editor" class="screen" hidden>
  <header id="e-bar" class="bar e-bar"></header>
  <div class="e-body">
    <nav id="e-tools" class="e-tools"></nav>
    <div id="e-stage" class="e-stage">
      <canvas id="e-canvas"></canvas>
      <div id="e-opts" class="e-opts" hidden></div>
      <div id="e-quick" class="e-quick"></div>
      <div id="e-ctxbar" class="e-ctxbar" hidden></div>
      <div id="e-loading" class="e-loading" hidden></div>
    </div>
    <aside id="e-dock" class="e-dock">
      <div class="dock-tabs">
        <button data-tab="brush">브러시</button>
        <button data-tab="color">색상</button>
        <button data-tab="layers">레이어</button>
        <button id="e-dock-close" class="ib" title="닫기" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="e-dock-body" class="dock-body"></div>
    </aside>
  </div>
</section>

<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/editor/doc.js"></script>
<script src="js/editor/brush.js"></script>
<script src="js/editor/tools.js"></script>
<script src="js/editor/panels.js"></script>
<script src="js/editor/text.js"></script>
<script src="js/editor/keys.js"></script>
<script src="js/editor/editor.js"></script>
<script src="js/project.js"></script>
<script src="js/sync.js"></script>
<script src="js/gallery.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
